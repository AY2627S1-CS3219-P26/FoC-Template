name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A newer push to the same branch or pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      user-service: ${{ steps.filter.outputs.user-service }}
      web-client: ${{ steps.filter.outputs.web-client }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            user-service:
              - 'user-service/**'
            web-client:
              - 'web-client/**'
            compose:
              - 'compose.yaml'
              - '*/Dockerfile'
              - '*/.dockerignore'
              - 'user-service/**'
              - 'supplier-service/**'
              - 'data/csv/**'
              - 'web-client/nginx/**'

  user-service:
    name: user-service
    needs: changes
    if: needs.changes.outputs.user-service == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: user-service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web-client:
    name: web-client
    needs: changes
    if: needs.changes.outputs.web-client == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-client/package-lock.json
      - run: npm ci
      # Lint first: it also enforces the import boundaries between the areas of src.
      - run: npm run lint
      - run: npm run build

  compose:
    name: compose
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the system the way N6.1.1 promises
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check the user-service answers
        run: curl --fail --silent --show-error http://localhost:3001/health
      # Status codes are compared on purpose, since 401 and 404 are the right answers here.
      - name: Check the web client and its gateway
        run: |
          failed=0
          check() {
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:8080$1")
            echo "$1 answered $status, expected $2"
            [ "$status" = "$2" ] || failed=1
          }
          check /healthz 200
          check /profile 200
          check /api/user/users/me 401
          check /api/supplier/suppliers 401
          check /api/user/internal/authorize 404
          exit $failed
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down --volumes

  publish:
    name: publish ${{ matrix.service }}
    needs: [user-service, web-client, compose]
    # Runs after a merge into main, also when the jobs above were skipped because nothing changed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !failure() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # One image failing to build does not hold back the others.
      fail-fast: false
      matrix:
        # order-service and credit-service get an entry here once their Dockerfile is filled in.
        include:
          - service: user-service
            context: user-service
            dockerfile: user-service/Dockerfile
          # Built from the repository root, because its seed file lives in data/csv.
          - service: supplier-service
            context: .
            dockerfile: supplier-service/Dockerfile
          - service: web-client
            context: web-client
            dockerfile: web-client/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/ay2627s1-cs3219-p26/${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}