name: cloud

# Starts, stops or restarts the Relay instance in AWS (deploy/terraform), so anyone in the team can
# do it from the Actions tab without AWS access of their own. CI runs it with restart after every
# merge into dev, so a running instance switches to the new images.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the cloud instance
        type: choice
        options: [status, start, stop, restart]
        default: status
  workflow_call:
    inputs:
      action:
        type: string
        required: true

# One action at a time, and none is cancelled halfway.
concurrency:
  group: cloud
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  cloud:
    name: cloud ${{ inputs.action }}
    # AWS_ROLE_ARN is the terraform output github_role_arn. Without it there is no instance to act on.
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1
      - name: ${{ inputs.action }}
        env:
          ACTION: ${{ inputs.action }}
        run: deploy/scripts/cloud.sh "$ACTION"
