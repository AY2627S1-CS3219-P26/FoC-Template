name: relay

services:
  user-service:
    build: ./user-service
    environment:
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGO_URL: mongodb://user-db:27017/user-service
      OTP_SECRET: ${OTP_SECRET:-dev-only-otp-secret-do-not-use-in-production}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Relay <no-reply@relay.local>}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nus.edu.sg}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ports:
      - "3001:3000"
    depends_on:
      user-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  user-db:
    image: mongo:8
    volumes:
      - user-db-data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  message-service:
    build: ./message-service
    environment:
      PORT: 3008
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MONGO_URL: mongodb://message-db:27017/message-service #uses the container port
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nus.edu.sg}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ports:
      - "3008:3008"
    depends_on:
      message-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3008/health" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  message-db:
    image: mongo:8 #Pulls mongo image 8 
    volumes:
      - message-db-data:/data/db # source/desination stored on my machine/stored inside container
    ports:
      - "127.0.0.1:27018:27017" #only on specific interfaces: local port on my machine to docker port
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped #makes the container restart automaticly 

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "127.0.0.1:1025:1025"
    restart: unless-stopped

  supplier-service:
    build:
      context: .
      dockerfile: supplier-service/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SUPPLIER_SERVICE_PORT: ${SUPPLIER_SERVICE_PORT:-3002}
      SUPPLIER_DATABASE_URL: postgres://${SUPPLIER_DB_USER:-supplier}:${SUPPLIER_DB_PASSWORD:-change-me}@supplier-db:5432/${SUPPLIER_DB_NAME:-supplier}
      USER_SERVICE_URL: http://user-service:3000
      SUPPLIER_TIMEZONE: ${SUPPLIER_TIMEZONE:-Asia/Singapore}
      SUPPLIER_SEED_ON_STARTUP: ${SUPPLIER_SEED_ON_STARTUP:-true}
      SUPPLIER_AUTH_CACHE_SECONDS: ${SUPPLIER_AUTH_CACHE_SECONDS:-5}
      SUPPLIER_READ_CACHE_SECONDS: ${SUPPLIER_READ_CACHE_SECONDS:-2}
    ports:
      - "127.0.0.1:${SUPPLIER_SERVICE_PORT:-3002}:${SUPPLIER_SERVICE_PORT:-3002}"
    # Not tied to the user-service: while that is down every request is refused,
    # and the supplier-service itself keeps running (N6.1.2).
    depends_on:
      supplier-db:
        condition: service_healthy
    restart: unless-stopped

  supplier-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${SUPPLIER_DB_USER:-supplier}
      POSTGRES_PASSWORD: ${SUPPLIER_DB_PASSWORD:-change-me}
      POSTGRES_DB: ${SUPPLIER_DB_NAME:-supplier}
    # Published to this machine only. The password is a placeholder for local use.
    ports:
      - "127.0.0.1:${SUPPLIER_DB_PORT:-5433}:5432"
    volumes:
      - supplier-db-data:/var/lib/postgresql/data
      # Gives the tests a database of their own, so they never touch real data.
      - ./supplier-service/db/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web-client:
    build: ./web-client
    environment:
      USER_SERVICE_URL: http://user-service:3000
      SUPPLIER_SERVICE_URL: http://supplier-service:${SUPPLIER_SERVICE_PORT:-3002}
      # Locally every email lands in Mailpit, so the verify page links to it. Set it to empty to hide the hint.
      DEV_MAILBOX_URL: ${DEV_MAILBOX_URL-http://localhost:8025}
    ports:
      - "8080:8080"
    # No depends_on on purpose: nginx looks the services up per request, so the web client
    # starts and stays up while a service is down or being replaced (N6.1.2).
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  #Place for docker to store data
  user-db-data:
  message-db-data:
  supplier-db-data:
