# The only way in from outside: everything goes to the web client's gateway, except /mail/ for
# Mailpit. The services and databases have no route of their own, as in compose.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relay
  labels:
    {{- include "relay.labels" (dict "root" $ "name" "relay") | nindent 4 }}
  {{- if .Values.ingress.tls }}
  annotations:
    # cert-manager sees this and gets the certificate for the tls section below.
    cert-manager.io/cluster-issuer: letsencrypt
    # Only HTTPS. Plain HTTP goes to the redirect below.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  {{- end }}
spec:
  ingressClassName: traefik
  {{- if .Values.ingress.tls }}
  tls:
    - hosts: [{{ .Values.ingress.host | required "ingress.host is required with ingress.tls" | quote }}]
      secretName: relay-tls
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /mail
            pathType: Prefix
            backend:
              service:
                name: mailpit
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-client
                port:
                  name: http
{{- if .Values.ingress.tls }}
---
# Plain HTTP only answers with a redirect to HTTPS. Let's Encrypt's check under
# /.well-known/acme-challenge/ still gets through: cert-manager adds its own, more specific route.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: relay-http-redirect
  labels:
    {{- include "relay.labels" (dict "root" $ "name" "relay") | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-client
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  labels:
    {{- include "relay.labels" (dict "root" $ "name" "relay") | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Gets certificates from Let's Encrypt. Let's Encrypt checks that the host really leads here by
# fetching a file over plain HTTP on port 80 (HTTP-01).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
  labels:
    {{- include "relay.labels" (dict "root" $ "name" "relay") | nindent 4 }}
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
{{- end }}
