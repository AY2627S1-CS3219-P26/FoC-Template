{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "relay.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "relay.labels" (dict "root" $ "name" $name) | nindent 8 }}
      annotations:
        {{- include "relay.secretChecksum" $ | nindent 8 }}
    spec:
      {{- with $.Values.images.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with $svc.waitFor }}
      # Kubernetes has no depends_on. This waits until every listed host:port accepts connections.
      initContainers:
        - name: wait-for-dependencies
          image: {{ $.Values.waitImage }}
          command:
            - sh
            - -c
            - |
              for target in "$@"; do
                until nc -z -w 2 "${target%:*}" "${target#*:}"; do echo "waiting for $target"; sleep 2; done
              done
            - wait-for
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "relay.image" (dict "root" $ "name" $name "svc" $svc) }}
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            {{- if $svc.secretEnv }}
            # Secrets first, so the plain variables below can use them as $(NAME).
            {{- end }}
            {{- range $svc.secretEnv }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secrets.name }}
                  key: {{ . }}
            {{- end }}
            {{- range $key, $value := $svc.env }}
            - name: {{ $key }}
              value: {{ tpl (toString $value) $ | quote }}
            {{- end }}
          # Gives a slow first start up to a minute before the other probes count.
          startupProbe:
            httpGet:
              path: {{ $svc.health }}
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Takes the pod out of the Service while it does not answer.
          readinessProbe:
            httpGet:
              path: {{ $svc.health }}
              port: http
            periodSeconds: 5
            failureThreshold: 2
          # Restarts the container when it hangs.
          livenessProbe:
            httpGet:
              path: {{ $svc.health }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml ($svc.resources | default $.Values.serviceDefaults.resources) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "relay.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
{{- end }}
