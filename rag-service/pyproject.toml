[project]
name = "rag-service"
version = "0.1.0"
description = "message service send http request to rag models and expect a synchronizes response"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3.0",
    "faiss-cpu>=1.15.1",
    "fastapi[standard]>=0.162.0",
    "numpy>=2.4.6",
    "sentence-transformers>=6.2.0",
]

[tool.fastapi]
entrypoint = "src.main:app"
